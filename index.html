// ---------- Importar CSV del banco ----------
// Parser genérico: separador auto (','/';'), respeta comillas, y adivina columnas por nombre de encabezado.
function parseCSV(text) {
  const firstLine = text.split(/\r?\n/, 1)[0] || '';
  const delim = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
  return text.split(/\r?\n/).filter(l => l.trim()).map(line => {
    const out = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === delim && !inQ) { out.push(cur.trim()); cur = ''; continue; }
      cur += c;
    }
    out.push(cur.trim());
    return out;
  });
}
function parseCsvAmount(s) {
  if (!s) return NaN;
  s = String(s).replace(/[^\d,.\-]/g, '');
  if (s.includes(',') && s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
  return parseFloat(s);
}
function parseCsvDate(s) {
  if (!s) return null;
  let m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = String(s).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); // dd/mm/yyyy
  if (m) return `${m[3]}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`;
  return null;
}
function csvGuessColumns(header) {
  const norm = h => (h || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const find = (...names) => header.findIndex(h => names.some(n => norm(h).includes(n)));
  return { date: find('fecha', 'date'), note: find('descripcion', 'concepto', 'detalle', 'description'),
    amount: find('monto', 'importe', 'amount'), debit: find('debito', 'debit', 'egreso'), credit: find('credito', 'credit', 'ingreso') };
}
let csvRows = [];
function csvImportModal() {
  openModal({ title: '📥 Importar CSV del banco',
    body: `<div class="field"><label>Archivo CSV</label><input id="csvFile" type="file" accept=".csv,text/csv"></div>
      <div class="hint" style="margin-top:0">Funciona con la mayoría de los extractos: busca columnas de fecha, descripción y monto (o débito/crédito por separado). Elegís billetera y unidad para todo el lote antes de confirmar.</div>
      <div id="csvPreviewArea"></div>`,
    onOpen: () => {
      $('#csvFile').onchange = e => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = () => csvParseAndPreview(String(reader.result));
        reader.readAsText(file, 'utf-8');
      };
    } });
}
function csvParseAndPreview(text) {
  const area = $('#csvPreviewArea'); if (!area) return;
  const table = parseCSV(text);
  if (table.length < 2) { area.innerHTML = `<div class="hint">El archivo parece vacío.</div>`; return; }
  const cols = csvGuessColumns(table[0]);
  if (cols.date < 0 || (cols.amount < 0 && cols.debit < 0 && cols.credit < 0)) {
    area.innerHTML = `<div class="hint">No pude detectar las columnas de fecha/monto. Revisá que el CSV tenga encabezados (fecha, descripción, monto).</div>`; return;
  }
  csvRows = table.slice(1).map(row => {
    const date = parseCsvDate(row[cols.date]);
    const note = cols.note >= 0 ? row[cols.note] : '';
    let amount;
    if (cols.amount >= 0) amount = parseCsvAmount(row[cols.amount]);
    else amount = (parseCsvAmount(row[cols.credit]) || 0) - (parseCsvAmount(row[cols.debit]) || 0);
    return { date, note, amount };
  }).filter(r => r.date && !isNaN(r.amount) && r.amount !== 0);
  if (!csvRows.length) { area.innerHTML = `<div class="hint">No encontré filas válidas para importar.</div>`; return; }
  const incN = csvRows.filter(r => r.amount > 0).length, expN = csvRows.length - incN;
  area.innerHTML = `
    <div class="hint">Encontré <b>${csvRows.length}</b> movimientos (${incN} ingresos, ${expN} gastos).</div>
    <div class="two"><div class="field"><label>Billetera</label><select id="csvWallet">${walletOptions(state.wallets[0]?.id)}</select></div>
      <div class="field"><label>Unidad</label><select id="csvUnit">${unitOptions(lensUnit() ? lens : state.units[0]?.id)}</select></div></div>
    <div class="list" style="max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin:10px 0">
      ${csvRows.slice(0, 30).map(r => `<div class="row" style="padding:8px 12px"><div class="info"><div class="title" style="font-size:13px">${esc(r.note || '(sin descripción)')}</div><div class="subtitle">${fmtDate(r.date)}</div></div><div class="amt ${r.amount < 0 ? 'neg' : 'pos'}" style="font-size:13px">${r.amount > 0 ? '+' : ''}${fmt(r.amount)}</div></div>`).join('')}
      ${csvRows.length > 30 ? `<div class="hint" style="padding:8px 12px">…y ${csvRows.length - 30} más</div>` : ''}
    </div>
    <div class="modal-actions"><button class="btn" id="okCsvImport">Importar ${csvRows.length} movimientos</button></div>`;
  $('#okCsvImport').onclick = () => {
    const walletId = $('#csvWallet').value, unitId = $('#csvUnit').value;
    for (const r of csvRows) {
      const type = r.amount > 0 ? 'income' : 'expense', abs = Math.abs(r.amount);
      const rule = state.rules.find(rr => (r.note || '').toLowerCase().includes(rr.match.toLowerCase()) && category(rr.categoryId)?.kind === type);
      state.movements.push({ id: uid(), type, amount: abs, date: r.date, categoryId: rule?.categoryId || null, note: r.note || '', source: 'importado', attachment: null,
        postings: [{ walletId, unitId, amount: type === 'income' ? abs : -abs }] });
    }
    const n = csvRows.length; save(); closeModal(); render(); toast(`${n} movimientos importados`);
  };
}

// ---------- Teclado calculadora ----------
let amt = '';
function evalAmount(s) {
  if (!s) return 0;
  let total = 0, num = '', sign = 1;
  for (const ch of s) {
    if (ch === '+' || ch === '-') { total += sign * parseFloat(num || '0'); sign = ch === '+' ? 1 : -1; num = ''; }
    else num += ch;
  }
  return total + sign * parseFloat(num || '0');
}
function keypadHTML() {
  const keys = ['7','8','9','del','4','5','6','-','1','2','3','+','.','0','00','clear'];
  const label = { del: '⌫', clear: 'C' };
  return `<div class="kp-display" id="kpDisplay"><span class="expr">0</span><span class="val"></span></div>
    <div class="keypad">${keys.map(k => `<button data-k="${k}" class="${k==='+'||k==='-'?'op':''} ${k==='del'||k==='clear'?'act':''}">${label[k] || k}</button>`).join('')}</div>`;
}
function inputCur() { const w = $('#wallet') || $('#fromWallet'); return w ? walletCur(w.value) : 'ARS'; }
function updKp() {
  const d = $('#kpDisplay'); if (!d) return;
  d.querySelector('.expr').textContent = amt || '0';
  const cur = inputCur(), val = evalAmount(amt);
  let s = '';
  if (/[+\-]/.test(amt)) s = '= ' + fmtCur(val, cur);
  else if (cur !== 'ARS' && amt) s = fmtCur(val, cur);
  if (cur !== 'ARS' && amt) s += ' ≈ ' + fmt(toARS(val, cur));
  d.querySelector('.val').textContent = s;
  const ta = $('#toAmt'); // transferencia entre monedas: sugerir monto recibido
  if (ta && ta.offsetParent !== null && !ta.dataset.touched) {
    ta.value = fromARS(toARS(val, cur), walletCur(($('#toWallet') || {}).value)).toFixed(2);
  }
}
function syncTransferCur() {
  const box = $('#toAmtBox'); if (!box) return;
  const fc = walletCur($('#fromWallet').value), tc = walletCur($('#toWallet').value);
  if (fc !== tc) { box.style.display = ''; $('#toAmtLabel').textContent = `Monto recibido (${tc})`; }
  else box.style.display = 'none';
  updKp();
}
function wireKeypad() {
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (k === 'del') amt = amt.slice(0, -1);
    else if (k === 'clear') amt = '';
    else if (k === '+' || k === '-') { if (amt === '') return; amt = /[+\-]$/.test(amt) ? amt.slice(0, -1) + k : amt + k; }
    else if (k === '.') { const last = amt.split(/[+\-]/).pop(); if (!last.includes('.')) amt += (amt === '' || /[+\-]$/.test(amt)) ? '0.' : '.'; }
    else amt += k;
    updKp();
  });
}

// ---------- Adjuntar foto (con compresión) ----------
let mAttach = null;
// Elige una foto, la comprime en canvas (≤1280px, JPEG q0.6) y entrega el data URL al callback.
function pickPhoto(cb) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
  input.onchange = () => {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1280, scale = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cb(cv.toDataURL('image/jpeg', 0.6));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}
function renderAttach() {
  const c = $('#attachSlot'); if (!c) return;
  c.innerHTML = mAttach
    ? `<div class="attach-preview"><img src="${mAttach}"><button class="rm" id="rmAttach">✕</button></div>`

  if (mAttach) $('#rmAttach').onclick = () => { mAttach = null; renderAttach(); };
  else $('#pickPhoto').onclick = () => pickPhoto(url => { mAttach = url; renderAttach(); });
}
function photoView(src) { if (!src) return; openModal({ title: 'Comprobante', body: `<div class="photo-full"><img src="${src}"></div>` }); }
// Los movimientos cargados por Telegram no traen la foto embebida: guardan la ruta
// en el bucket privado y se abren con una URL firmada al momento de mirarlas.
async function photoModal(id) {
  const m = state.movements.find(x => x.id === id);
  if (!m) return;
  if (m.attachment) return photoView(m.attachment);
  if (!m.attachmentPath) return;
  if (!cloudReady()) return toast('Conectate a la nube para ver esta foto');
  try {
    const res = await supaFetch('/storage/v1/object/sign/comprobantes/' + m.attachmentPath,
      { method: 'POST', body: JSON.stringify({ expiresIn: 3600 }) });
    if (!res.ok) throw 0;
    photoView(SUPA_URL + '/storage/v1' + (await res.json()).signedURL);
  } catch { toast('No pude abrir el comprobante'); }
}

function saveSimple(type) {
  let amount = evalAmount(amt);
  if (!amount || amount <= 0) return toast('Ingresá un monto válido');
  let note = $('#note').value.trim();
  // Ingreso con comisión (ej: cobro por MP): se registra el neto que llega de verdad.
  const fee = $('#feePct') ? Math.max(0, parseFloat($('#feePct').value) || 0) : 0;
  if (type === 'income' && fee > 0) { amount = r2(amount * (1 - fee / 100)); note = (note ? note + ' · ' : '') + `neto de ${fee}% com.`; }
  if (mEditId) {
    const m = state.movements.find(x => x.id === mEditId);
    m.type = type; m.amount = amount; m.date = $('#date').value; m.categoryId = $('#cat').value; m.note = note; m.attachment = mAttach || null;
    m.postings = [{ walletId: $('#wallet').value, unitId: $('#unit').value, amount: type === 'income' ? amount : -amount }];
    mEditId = null; save(); closeModal(); render(); return toast('Movimiento actualizado');
  }
  const m = { id: uid(), type, amount, date: $('#date').value, categoryId: $('#cat').value, note, source: 'manual', attachment: mAttach || null,
    postings: [{ walletId: $('#wallet').value, unitId: $('#unit').value, amount: type === 'income' ? amount : -amount }] };
  state.movements.push(m);
  let msg = type === 'income' ? 'Ingreso registrado' : 'Gasto registrado';
  if (type === 'expense') {
    // Redondeo hacia la meta de ahorro (solo billeteras en pesos)
    const step = state.prefs.roundupStep || 0;
    const g = step > 0 ? state.goals.find(x => x.id === state.prefs.roundupGoal) : null;
    if (g && walletCur(m.postings[0].walletId) === 'ARS') {
      const diff = r2(Math.ceil(amount / step) * step - amount);
      if (diff > 0) { g.saved = r2((g.saved || 0) + diff); msg += ` · 🪙 ＋${fmt(diff)} a «${g.name}»`; }
    }
    // Aviso al acercarse o pasarse del presupuesto de la categoría (o su principal)
    const top = catTop(m.categoryId);
    const b = state.budgets.find(x => x.categoryId === m.categoryId || (top && x.categoryId === top.id));
    if (b) {
      const ym = m.date.slice(0, 7);
      const spent = state.movements.filter(x => x.type === 'expense' && x.date.slice(0, 7) === ym && x.categoryId && (x.categoryId === b.categoryId || category(x.categoryId)?.parentId === b.categoryId)).reduce((s, x) => s + movARS(x), 0);
      if (spent > b.amount) msg = `⚠ Superaste el presupuesto de ${catFullName(b.categoryId)}: ${fmt(spent)} de ${fmt(b.amount)}`;
      else if (spent / b.amount >= 0.8) msg = `Ojo: vas por el ${Math.round(spent / b.amount * 100)}% del presupuesto de ${catFullName(b.categoryId)}`;
    }
  }
  save(); closeModal(); render();
  toast(msg);
}
function saveTransfer() {
  const amount = evalAmount(amt);
  if (!amount || amount <= 0) return toast('Ingresá un monto válido');
  const fw = $('#fromWallet').value, fu = $('#fromUnit').value, tw = $('#toWallet').value, tu = $('#toUnit').value;
  if (fw === tw && fu === tu) return toast('El origen y el destino son iguales');
  const fc = walletCur(fw), tc = walletCur(tw);
  let toAmount = amount;
  if (fc !== tc) { toAmount = parseFloat($('#toAmt').value); if (!toAmount || toAmount <= 0) return toast('Ingresá el monto recibido'); }
  if (mEditId) {
    const m = state.movements.find(x => x.id === mEditId);
    m.amount = amount; m.date = $('#date').value; m.note = $('#note').value.trim(); m.attachment = mAttach || null;
    m.postings = [{ walletId: fw, unitId: fu, amount: -amount }, { walletId: tw, unitId: tu, amount: toAmount }];
    mEditId = null; save(); closeModal(); render(); return toast('Transferencia actualizada');
  }
  const m = { id: uid(), type: 'transfer', amount, date: $('#date').value, categoryId: null, note: $('#note').value.trim(), source: 'manual', attachment: mAttach || null,
    postings: [{ walletId: fw, unitId: fu, amount: -amount }, { walletId: tw, unitId: tu, amount: toAmount }] };
  state.movements.push(m); save(); closeModal(); render(); toast('Transferencia registrada');
}
function saveAdjust() {
  const walletId = $('#wallet').value, unitId = $('#unit').value, target = parseFloat($('#target').value);
  if (isNaN(target)) return toast('Ingresá el saldo real');
  const diff = target - walletBalance(walletId);
  if (Math.abs(diff) < 0.005) return toast('Ya está cuadrado');
  const m = { id: uid(), type: diff > 0 ? 'income' : 'expense', amount: Math.abs(diff), date: $('#date').value, categoryId: null, note: 'Ajuste de saldo', source: 'manual',
    postings: [{ walletId, unitId, amount: diff }] };
  state.movements.push(m); save(); closeModal(); render(); toast('Ajuste registrado');
}

// ---------- Recurrentes / suscripciones ----------
const freqLabel = f => ({ monthly: 'Mensual', weekly: 'Semanal', yearly: 'Anual' }[f] || f);
const KINDS = { suscripcion: 'Suscripción', cuota: 'Cuota', sueldo: 'Sueldo', servicio: 'Servicio', otro: 'Otro', ingreso: 'Ingreso' };
const kindEmoji = { suscripcion: '🔁', cuota: '💳', sueldo: '👤', servicio: '🧾', otro: '📌', ingreso: '💰' };
const monthlyFactor = f => f === 'weekly' ? 52 / 12 : f === 'yearly' ? 1 / 12 : 1;
const recCur = r => r.template.type === 'transfer' ? walletCur(r.template.fromWallet) : walletCur(r.template.walletId);
const recMonthlyARS = r => toARS(r.template.amount, recCur(r)) * monthlyFactor(r.freq);
function recExpenseMonthlyTotal() { return state.recurring.filter(r => r.active && r.template.type === 'expense' && recInLens(r)).reduce((s, r) => s + recMonthlyARS(r), 0); }
function fixedByCat() {
  const map = {};
  state.recurring.filter(r => r.active && r.template.type === 'expense' && recInLens(r)).forEach(r => { const top = catTop(r.template.categoryId); const k = top ? top.id : '__none'; map[k] = (map[k] || 0) + recMonthlyARS(r); });
  let arr = Object.entries(map).map(([k, v]) => ({ id: k, name: k === '__none' ? 'Sin categoría' : (category(k)?.name || '—'), amount: v })).sort((a, b) => b.amount - a.amount);

// ---------- Recordatorios (vencimientos próximos: recurrentes + deudas) ----------
function daysUntil(iso) {
  const [y, m, d] = iso.split('-').map(Number), t = new Date();

}

function reminders() {
  const out = [];
  for (const r of state.recurring) {
    if (!r.active || !recInLens(r)) continue;
    const n = daysUntil(r.nextDate);
    if (n <= 7) out.push({ kind: 'rec', id: r.id, name: recName(r), n, amount: r.template.amount, cur: recCur(r), type: r.template.type, auto: r.auto, date: r.nextDate });
  }
  for (const d of state.debts) {
    if (!d.dueDate || debtRemaining(d) <= 0.005 || debtInPlan(d.id)) continue; // las que están en plan avisan por la cuota
    const n = daysUntil(d.dueDate), owe = debtDir(d) === 'owe';
    if (n <= 7) out.push({ kind: 'debt', id: d.id, name: `${d.person}${d.name ? ' · ' + d.name : ''}`, n, amount: debtRemaining(d), cur: d.currency, type: owe ? 'expense' : 'income', owe, date: d.dueDate });
  }
  for (const p of state.payplans || []) {
    if (!planActive(p)) continue;
    const nd = planNextDate(p), n = daysUntil(nd);
    if (n <= 7) out.push({ kind: 'plan', id: p.id, name: `${p.name} · cuota ${(p.paidCount || 0) + 1}/${p.installments}`, n, amount: planCuota(p), cur: p.currency, type: 'expense', owe: true, date: nd });
  }
  return out.sort((a, b) => a.n - b.n);
}

// ---------- Proyección mes a mes de recurrentes ----------
// Simula las reglas activas (respetando frecuencia y cuotas restantes) para saber
// cuánto habría que pagar (y cobrar) en cada uno de los próximos meses.
function recProjection(months = 6) {
  const t = new Date(), buckets = [];
  for (let i = 0; i < months; i++) {
    const d = new Date(t.getFullYear(), t.getMonth() + i, 1);
    buckets.push({ key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`,
      label: d.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }), exp: 0, inc: 0, items: [] });
  }
  const lastKey = buckets[buckets.length - 1].key;
  for (const r of state.recurring) {
    if (!r.active || r.template.type === 'transfer' || !recInLens(r)) continue;
    let date = r.nextDate, paid = r.paidCount || 0, guard = 0;
    while (date.slice(0, 7) <= lastKey && guard < 500) {
      if (r.installments && paid >= r.installments) break;
      const b = buckets.find(x => x.key === date.slice(0, 7));
      if (b) {
        const ars = toARS(r.template.amount, recCur(r));
        if (r.template.type === 'expense') b.exp += ars; else b.inc += ars;
        b.items.push({ date, name: recName(r), type: r.template.type, amount: r.template.amount, cur: recCur(r), ars,
          inst: r.installments ? ` · cuota ${Math.min(paid + 1, r.installments)}/${r.installments}` : '' });
      }
      paid++; date = advanceDate(date, r.freq); guard++;
    }
  }
  buckets.forEach(b => b.items.sort((a, c) => a.date.localeCompare(c.date)));
  return buckets;
}
function projModal(key) {
  const b = recProjection(12).find(x => x.key === key); if (!b) return;
  const rows = b.items.map(i => `<div class="row">
      <div class="avatar" style="background:var(--surface-2)">${i.type === 'income' ? '💰' : '🧾'}</div>
      <div class="info"><div class="title">${esc(i.name)}${i.inst}</div><div class="subtitle">${fmtDate(i.date)}${i.cur !== 'ARS' ? ' · ≈ ' + fmt(i.ars) : ''}</div></div>
      <div class="amt" style="color:${i.type === 'income' ? 'var(--pos)' : 'var(--neg)'}">${fmtCur(i.amount, i.cur)}</div>
    </div>`).join('') || emptyBox('—', 'Nada previsto este mes');
  openModal({ title: `Pagos de ${b.label}`,
    body: `<div class="list" style="margin:-6px -6px 10px">${rows}</div>
      <div style="display:flex;justify-content:space-between;font-weight:700;padding:10px 4px;border-top:1px solid var(--border)">
        <span>Total a pagar</span><span style="color:var(--neg)">${fmt(b.exp)}</span></div>
      ${b.inc > 0.005 ? `<div style="display:flex;justify-content:space-between;padding:0 4px 6px;color:var(--text-muted)"><span>Ingresos fijos previstos</span><span style="color:var(--pos)">${fmt(b.inc)}</span></div>` : ''}` });
}
function advanceDate(iso, freq) {
  const [Y, M, D] = iso.split('-').map(Number);
  const d = new Date(Y, M - 1, D);
  if (freq === 'weekly') d.setDate(d.getDate() + 7);
  else if (freq === 'yearly') d.setFullYear(d.getFullYear() + 1);
  else { const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + 1); const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, dim)); }

}
function recToMovement(t, date) {
  if (t.type === 'transfer') return { id: uid(), type: 'transfer', amount: t.amount, date, categoryId: null, note: t.note || '', source: 'recurrente', attachment: null,
    postings: [{ walletId: t.fromWallet, unitId: t.fromUnit, amount: -t.amount }, { walletId: t.toWallet, unitId: t.toUnit, amount: t.amount }] };
  return { id: uid(), type: t.type, amount: t.amount, date, categoryId: t.categoryId || null, note: t.note || '', source: 'recurrente', attachment: null,
    postings: [{ walletId: t.walletId, unitId: t.unitId, amount: t.type === 'income' ? t.amount : -t.amount }] };
}
// Postea una ocurrencia: crea el movimiento, avanza fecha y, si es un plan de cuotas, lo cierra al completarse.
function postRecurrence(r) {

  if (r.installments && r.paidCount >= r.installments) r.active = false; // cuotas terminadas

}

function csvEscape(s) { s = String(s ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCSV() {

  const rows = [...state.movements].sort((a, b) => a.date.localeCompare(b.date)).map(m => {

      ow = wallet(f.walletId)?.name || ''; ou = unit(f.unitId)?.name || ''; dw = wallet(t.walletId)?.name || ''; du = unit(t.unitId)?.name || '';
    } else { const p = m.postings[0]; ow = wallet(p.walletId)?.name || ''; ou = unit(p.unitId)?.name || ''; }
    return [m.date, typeLabel[m.type] || m.type, m.amount, catFullName(m.categoryId), ow, ou, dw, du, m.note || ''].map(csvEscape).join(',');
  });

        <button class="btn" id="pinSave">Guardar PIN</button></div>`,
    onOpen: () => {
      $('#pinSave').onclick = () => { const v = $('#pinInput').value; if (!/^\d{4}$/.test(v)) return toast('Poné 4 dígitos'); localStorage.setItem('gf-pin', hashPin(v)); closeModal(); render(); toast('PIN activado'); };
      if (has) $('#pinRemove').onclick = () => { localStorage.removeItem('gf-pin'); closeModal(); render(); toast('PIN quitado'); };
    } });
}

$('#lensSel').onchange = e => { lens = e.target.value; localStorage.setItem('gf-lens', lens); render(); };

function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('gf-theme', t); }
$('#themeBtn').onclick = () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
applyTheme(localStorage.getItem('gf-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

render(); // pinta rápido con lo local; puebla #lensSel antes de medir el nav
layoutNav();
// Luego: baja de la nube si hay algo más nuevo, recién ahí corre los recurrentes automáticos.
cloudInit().catch(() => {}).finally(() => { processRecurring(); render(); fetchRates(); });
// La nube cambió de proyecto: hay que volver a conectar (los datos locales están intactos).
if (supaMudanza) setTimeout(() => toast('☁ La nube se mudó de servidor: reconectá en Config → Nube'), 800);
if (localStorage.getItem('gf-pin')) showLock();
</script>
</body>
</html>
