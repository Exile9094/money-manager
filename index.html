<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gestor de Finanzas</title>
<!-- PWA: instalable + offline. El manifest/íconos/sw viven junto a index.html en GitHub Pages. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f3a5f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="mobile-web-app-capable" content="yes">
<script>
  // Registrar el service worker solo servido por HTTPS (no en file://, donde no aplica).
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
<style>
  :root {
    /* Identidad "libro mayor": papel de contabilidad verde pálido + tinta azul marino */
    --bg: #eef1e7;
    --surface: #ffffff;
    --surface-2: #e5e9da;
    --border: #d7dcc7;
    --text: #1a2119;
    --text-muted: #5c6353;
    --text-soft: #8b9180;
    --brand: #1f3a5f;
    --brand-soft: #e3e9f0;
    --pos: #059669;
    --pos-soft: #ecfdf5;
    --neg: #dc2626;
    --neg-soft: #fef2f2;
    --transfer: #0891b2;
    --transfer-soft: #ecfeff;
    --warn: #d97706;
    --shadow: 0 1px 2px rgba(26,33,25,.05), 0 4px 16px rgba(26,33,25,.07);
    --radius: 16px;
    --radius-sm: 10px;
    --font-mono: ui-monospace, 'Cascadia Code', 'SF Mono', 'JetBrains Mono', 'Roboto Mono', Consolas, monospace;
    /* Paleta de gráficos (dataviz, validada) — modo claro */
    --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#008300;
    --s5:#4a3aa7; --s6:#e34948; --s7:#e87ba4; --s8:#eb6834; --s-other:#898781;
  }
  html[data-theme="dark"] {
    --bg: #10140f;
    --surface: #171c15;
    --surface-2: #1f251a;
    --border: #2c3324;
    --text: #e8ebe1;
    --text-muted: #9aa08c;
    --text-soft: #676d5c;
    --brand: #7fa3d9;
    --brand-soft: #1c2a3d;
    --pos: #34d399;
    --pos-soft: #103028;
    --neg: #f87171;
    --neg-soft: #331a1a;
    --transfer: #22d3ee;
    --transfer-soft: #0e2a30;
    --warn: #f59e0b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    /* Paleta de gráficos — modo oscuro (mismos tonos ajustados) */
    --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#008300;
    --s5:#9085e9; --s6:#e66767; --s7:#d55181; --s8:#d95926;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; line-height: 1.5;
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 15px; }

  .appbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--surface) 85%, transparent);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
    /* PWA en pantalla completa: dejar respirar el notch / barra de estado del celular. */
    padding-top: env(safe-area-inset-top);
  }
  .appbar-inner { max-width: 1080px; margin: 0 auto; padding: 12px 20px; padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); display: flex; align-items: center; gap: 14px; }
  /* Ancho fijo para los hermanos del nav: si pudieran achicarse, el cálculo de layoutNav() (que resta
     sus anchos para saber cuánto le queda al nav) dejaría de ser confiable. */
  .appbar-inner > .brand, .appbar-inner > select, .appbar-inner > .btn { flex: none; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
  .brand .logo { width: 30px; height: 30px; border-radius: 9px; flex: none; background: linear-gradient(135deg, var(--brand), #3f6b4a); display: grid; place-items: center; color: #fff; font-size: 16px; }
  .nav { display: flex; gap: 2px; margin-left: 4px; background: var(--surface-2); padding: 3px; border-radius: 12px; overflow: hidden; min-width: 0; }
  .nav button { border: none; background: transparent; color: var(--text-muted); padding: 7px 13px; border-radius: 9px; font-size: 14px; font-weight: 600; white-space: nowrap; transition: all .15s; flex: none; }
  .nav button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .nav button.is-overflow { display: none; }
  .nav-more { display: none; border: none; background: transparent; color: var(--text-muted); padding: 7px 11px; border-radius: 9px; font-size: 15px; font-weight: 700; flex: none; letter-spacing: 1px; }
  .nav-more.show { display: inline-flex; align-items: center; }
  .nav-more.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  /* Fuera de .nav (que tiene overflow:hidden para recortar los botones que no entran):
     si viviera adentro, ese mismo overflow:hidden también taparía el desplegable. Se
     posiciona con JS (position:fixed) pegado al botón "⋯" al abrirse. */
  .nav-menu { position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.18); padding: 6px; display: none; flex-direction: column; gap: 1px; min-width: 168px; z-index: 30; }
  .nav-menu.open { display: flex; }
  .nav-menu button { text-align: left; padding: 9px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--text-muted); background: transparent; border: none; }
  .nav-menu button:hover { background: var(--surface-2); color: var(--text); }
  .nav-menu button.active { color: var(--brand); }
  .spacer { flex: 1; }
  .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-size: 16px; display: grid; place-items: center; transition: all .15s; flex: none; }
  .icon-btn:hover { color: var(--text); border-color: var(--text-soft); }
  .btn { border: none; border-radius: 11px; padding: 9px 16px; font-weight: 600; font-size: 14px; background: var(--brand); color: #fff; display: inline-flex; align-items: center; gap: 7px; transition: filter .15s, transform .05s; white-space: nowrap; }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: var(--surface-2); color: var(--text); }
  .btn.danger { background: var(--neg-soft); color: var(--neg); }
  .btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 9px; }

  main { max-width: 1080px; margin: 0 auto; padding: 22px 20px 90px; }
  .view { display: none; animation: fade .25s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (max-width: 760px) { .brand span.name { display: none; } }
  /* Pantallas angostas: la navegación (cambiar de vista) importa más que el selector de
     lente o el texto del botón "Nuevo" — se lo prioriza achicando al resto. */
  @media (max-width: 560px) {
    .appbar-inner { gap: 8px; }
    #lensSel { max-width: 84px !important; }
    #newBtn .lbl { display: none; }
    #newBtn { padding: 9px 12px; }
  }

  h2.section { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-soft); font-weight: 700; margin: 26px 0 12px; }
  h2.section:first-child { margin-top: 0; }

  /* Secciones plegables (libro mayor: cada una es una "página" que se abre) */
  details.section { margin: 26px 0 0; }
  details.section:first-child { margin-top: 0; }
  details.section > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
    font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-soft); font-weight: 700;
    padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--border); transition: border-color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  details.section > summary::-webkit-details-marker { display: none; }
  details.section > summary .chev { margin-left: auto; font-size: 11px; color: var(--text-soft); transition: transform .18s, color .15s; transform: rotate(90deg); flex: none; }
  details.section:not([open]) > summary .chev { transform: rotate(0deg); }
  details.section > summary:hover { color: var(--text); border-color: var(--brand); }
  details.section > summary:hover .chev { color: var(--brand); }
  details.section > summary .badge { text-transform: none; letter-spacing: 0; }
  /* Recordatorios: es un aviso, no una sección más — su encabezado va en color de alerta
     y con algo de aire abajo (antes era una card suelta con margin-bottom propio). */
  details.section[data-sec="dash-reminders"] { margin-bottom: 18px; }
  details.section[data-sec="dash-reminders"] > summary { color: var(--warn); border-color: var(--warn); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .grid { display: grid; gap: 14px; }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 760px) { .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; } }

  .hero { padding: 22px 24px; }
  .hero .label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
  .hero .total { font-size: 40px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
  .hero .sub { display: flex; gap: 18px; margin-top: 14px; flex-wrap: wrap; }
  .hero .sub .chip { font-size: 13px; color: var(--text-muted); }
  .hero .sub .chip b { color: var(--text); font-weight: 700; }

  .stat { padding: 18px; }
  .stat .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .stat .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .stat .name { font-weight: 600; font-size: 14px; }
  .stat .amount { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .stat .meta { font-size: 12px; color: var(--text-soft); margin-top: 2px; }

  .list { padding: 6px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px; transition: background .12s; }
  .row:hover { background: var(--surface-2); }
  .row .avatar { width: 40px; height: 40px; border-radius: 11px; flex: none; display: grid; place-items: center; font-size: 18px; }
  .row .info { flex: 1; min-width: 0; }
  .row .info .title { font-weight: 600; font-size: 14.5px; overflow-wrap: break-word; }
  @media (min-width: 561px) { .row .info .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } }
  .row .info .subtitle { font-size: 12.5px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row .amt { font-weight: 700; font-size: 15px; white-space: nowrap; }
  /* Celular: si el título + el monto + los botones no entran en una línea, la plata y las
     acciones bajan juntas a una segunda línea (alineadas a la derecha) y el título se queda
     con el ancho completo. Antes competían por el mismo renglón y el título terminaba en una
     columna de ~50px que partía las palabras letra por letra ("Comp/ra de/nafta"). El basis
     de 165px es el umbral: lo que entra cómodo sigue en un solo renglón (billeteras, montos
     cortos) y solo baja lo que no entraba. */
  @media (max-width: 560px) {
    .row { flex-wrap: wrap; justify-content: flex-end; row-gap: 6px; }
    .row .info { flex-basis: 165px; }
  }
  .row .del { border: none; background: transparent; color: var(--text-soft); font-size: 15px; padding: 4px 6px; border-radius: 7px; }
  /* En mouse fino se oculta hasta el hover (menos ruido visual); en touch (sin hover real)
     queda siempre visible, porque si no el botón nunca aparece con un solo tap. */
  @media (hover: hover) and (pointer: fine) {
    .row .del { opacity: 0; }
    .row:hover .del { opacity: 1; }
  }
  .row .del:hover { color: var(--neg); background: var(--neg-soft); }
  .row .row-chev { color: var(--text-soft); font-size: 15px; flex: none; }
  .amt.pos { color: var(--pos); } .amt.neg { color: var(--neg); } .amt.tr { color: var(--transfer); }

  /* Cifras: monoespaciado tabular — vibra a libro contable / cinta de sumadora */
  .hero .total, .stat .amount, .row .amt, .bud-nums, .donut-total, .io-item .io-top span:last-child,
  .bk-row .am, .bk-row .pc, .cal-cell .ci, .cal-cell .ce, .kp-display .expr, .kp-display .val {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  }

  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: var(--surface-2); color: var(--text-muted); white-space: nowrap; }
  .badge.unit { background: var(--brand-soft); color: var(--brand); }
  .empty { text-align: center; padding: 44px 20px; color: var(--text-soft); }
  .empty .big { font-size: 34px; margin-bottom: 8px; }

  .cfg-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .cfg-row:last-child { border-bottom: none; }
  .cfg-row .swatch { width: 14px; height: 14px; border-radius: 5px; flex: none; }
  .cfg-row .grow { flex: 1; }
  .cfg-row .muted { color: var(--text-muted); font-size: 13px; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar select, .toolbar input { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }

  /* Selector de mes */
  .period { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; box-shadow: var(--shadow); }
  .period .pbtn { width: 32px; height: 32px; border: none; background: transparent; color: var(--text-muted); font-size: 20px; border-radius: 8px; display: grid; place-items: center; }
  .period .pbtn:hover { background: var(--surface-2); color: var(--text); }
  .period .plabel { font-weight: 700; font-size: 15px; min-width: 130px; text-align: center; text-transform: capitalize; }

  /* Calendario */
  .cal-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
  .cal-head span { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-soft); text-transform: uppercase; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-cell { aspect-ratio: 1 / 1; border-radius: 10px; border: 1px solid var(--border); padding: 5px 6px; display: flex; flex-direction: column; overflow: hidden; transition: border-color .12s, background .12s; }
  .cal-cell.filled { cursor: pointer; }
  .cal-cell.filled:hover { border-color: var(--brand); }
  .cal-cell.empty-cell { border: none; background: transparent; }
  .cal-cell.today { border-color: var(--brand); background: var(--brand-soft); }
  .cal-cell .d { font-size: 12px; font-weight: 700; color: var(--text-muted); }
  .cal-cell .amts { margin-top: auto; display: flex; flex-direction: column; gap: 1px; line-height: 1.25; }
  .cal-cell .ci { font-size: 10.5px; font-weight: 700; color: var(--pos); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-cell .ce { font-size: 10.5px; font-weight: 700; color: var(--neg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 620px) { .cal-cell { padding: 3px; } .cal-cell .ci, .cal-cell .ce { font-size: 9px; } }

  /* Estadísticas / donut */
  .donut-wrap { display: flex; gap: 24px; align-items: center; padding: 20px; flex-wrap: wrap; justify-content: center; }
  .donut { width: 190px; height: 190px; flex: none; }
  .donut circle { transition: stroke-width .12s; }
  .donut circle:hover { stroke-width: 19px; }
  .donut-total { font-size: 13px; font-weight: 800; fill: var(--text); }
  .donut-cap { font-size: 9px; fill: var(--text-soft); text-transform: uppercase; letter-spacing: .05em; }
  .breakdown { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 4px; }
  .bk-row { display: flex; align-items: center; gap: 10px; padding: 6px 4px; }
  .bk-row .sw { width: 11px; height: 11px; border-radius: 3px; flex: none; }
  .bk-row .nm { flex: 1; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bk-row .pc { font-size: 12px; color: var(--text-soft); width: 44px; text-align: right; }
  .bk-row .am { font-size: 13.5px; font-weight: 700; width: 96px; text-align: right; font-variant-numeric: tabular-nums; }

  .io-bars { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .io-item .io-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .io-track { height: 12px; background: var(--surface-2); border-radius: 8px; overflow: hidden; }
  .io-fill { height: 100%; border-radius: 8px; }

  /* Presupuestos */
  .bud-row { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .bud-row:last-child { border-bottom: none; }
  .bud-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .bud-name { font-weight: 600; font-size: 14px; }
  .bud-nums { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .bud-track { height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .bud-fill { height: 100%; border-radius: 6px; transition: width .3s; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(10,12,16,.5); backdrop-filter: blur(3px); display: none; align-items: flex-start; justify-content: center; z-index: 50; padding: 34px 16px; overflow-y: auto; }
  .overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; width: 100%; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: pop .2s ease; }
  @keyframes pop { from { opacity: 0; transform: scale(.97) translateY(8px); } to { opacity: 1; transform: none; } }
  .modal .head { padding: 20px 22px 0; display: flex; align-items: center; justify-content: space-between; }
  .modal .head h3 { font-size: 18px; font-weight: 700; }
  .modal .body { padding: 18px 22px 22px; }

  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; margin-bottom: 18px; }
  .seg button { border: none; background: transparent; padding: 9px 4px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--text-muted); }
  .seg button.active { background: var(--surface); box-shadow: var(--shadow); color: var(--text); }
  .seg button.active[data-t="income"] { color: var(--pos); }
  .seg button.active[data-t="expense"] { color: var(--neg); }
  .seg button.active[data-t="transfer"] { color: var(--transfer); }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea { width: 100%; padding: 11px 13px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface); color: var(--text); transition: border-color .15s; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .transfer-box { background: var(--surface-2); border-radius: 14px; padding: 14px; margin-bottom: 6px; }
  .transfer-box .tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-soft); margin-bottom: 8px; }
  .transfer-arrow { text-align: center; font-size: 18px; color: var(--transfer); margin: 8px 0; }
  .hint { font-size: 12px; color: var(--text-soft); margin-top: -4px; margin-bottom: 12px; line-height: 1.45; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions .btn { flex: 1; justify-content: center; }

  /* Teclado tipo calculadora */
  .kp-display { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; text-align: right; }
  .kp-display .expr { font-size: 30px; font-weight: 800; letter-spacing: -.01em; display: block; overflow-x: auto; }
  .kp-display .val { font-size: 13px; color: var(--text-muted); font-weight: 600; min-height: 16px; display: block; }
  .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .keypad button { border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 19px; font-weight: 600; padding: 14px 0; border-radius: 12px; transition: background .1s; }
  .keypad button:hover { background: var(--surface-2); }
  .keypad button:active { transform: translateY(1px); }
  .keypad button.op { color: var(--brand); }
  .keypad button.act { color: var(--neg); font-size: 15px; }

  /* Adjuntos / foto */
  .attach-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 11px 13px; border-radius: 11px; border: 1px dashed var(--border); background: var(--surface); color: var(--text-muted); font-weight: 600; font-size: 13px; justify-content: center; }
  .attach-btn:hover { border-color: var(--brand); color: var(--brand); }
  .attach-preview { position: relative; margin-bottom: 14px; }
  .attach-preview img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; display: block; }

<script>
"use strict";

// ---------- Utilidades ----------
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(36).slice(2));
const $ = (sel, el=document) => el.querySelector(sel);
const money = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 2 });
const fmt = n => money.format(n || 0);
const fmtShort = n => { const a = Math.abs(n); if (a >= 1e6) return (n/1e6).toFixed(1).replace('.0','') + 'M'; if (a >= 1000) return Math.round(n/1000) + 'k'; return String(Math.round(n)); };
const fmtDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: 'short' });
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayISO = () => isoOf(new Date());
const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

// ---------- Estado ----------
const KEY = 'gestor-finanzas-v1';
let state = load() || seed();
migrate();

function seed() {
  const personal = uid(), negocio = uid();
  return {
    units: [
      { id: personal, name: 'Personal', kind: 'personal' },
      { id: negocio, name: 'Mi Negocio', kind: 'business' },
    ],
    wallets: [
      { id: uid(), name: 'Efectivo', emoji: '💵', opening: 0, openingUnit: personal, currency: 'ARS' },
      { id: uid(), name: 'Mercado Pago', emoji: '🟦', opening: 0, openingUnit: personal, currency: 'ARS' },
      { id: uid(), name: 'Banco Nación', emoji: '🏦', opening: 0, openingUnit: personal, currency: 'ARS' },
    ],
    categories: [
      { id: uid(), name: 'Sueldo / Cobros', kind: 'income' },
      { id: uid(), name: 'Ventas', kind: 'income' },
      { id: uid(), name: 'Otros ingresos', kind: 'income' },
      { id: uid(), name: 'Comida', kind: 'expense' },
      { id: uid(), name: 'Transporte', kind: 'expense' },
      { id: uid(), name: 'Servicios', kind: 'expense' },
      { id: uid(), name: 'Ocio', kind: 'expense' },
      { id: uid(), name: 'Insumos', kind: 'expense' },
      { id: uid(), name: 'Publicidad', kind: 'expense' },
      { id: uid(), name: 'Impuestos', kind: 'expense' },
      { id: uid(), name: 'Otros gastos', kind: 'expense' },
    ],
    budgets: [],
    recurring: [],
    movements: [],
    debts: [],
    payplans: [],
    goals: [],
    rules: [],
    prefs: {},
    fx: defaultFx(),
  };
}
function defaultFx() {
  return {
    USD:  { buy: 1150, sell: 1200, updated: null, source: 'default' },
    EUR:  { buy: 1250, sell: 1300, updated: null, source: 'default' },
    USDT: { buy: 1200, sell: 1250, updated: null, source: 'default' },
  };
}
function migrate() {
  if (!state.budgets) state.budgets = [];
  if (!state.recurring) state.recurring = [];
  if (!state.debts) state.debts = [];
  if (!state.payplans) state.payplans = [];
  if (!state.goals) state.goals = [];
  if (!state.rules) state.rules = [];
  if (!state.prefs) state.prefs = {};
  if (!state.fx) state.fx = defaultFx();
  if (!state.fx.EUR) state.fx.EUR = defaultFx().EUR;
  for (const w of state.wallets) if (!w.currency) w.currency = 'ARS';
  // Deudas: dirección (debo/me deben) y persona (los viejos "a quién/concepto" pasan a persona)
  for (const d of state.debts) {
    if (!d.dir) d.dir = 'owe';
    if (d.person == null) { d.person = d.name || 'Sin nombre'; d.name = ''; }
  }
  // Recurrentes: campos nuevos (tipo de compromiso y cuotas)
  for (const r of state.recurring) {
    if (!r.kind) r.kind = r.template && r.template.type === 'income' ? 'ingreso' : 'otro';
    if (r.installments == null) r.installments = null; // null = indefinido; número = plan de cuotas
    if (r.paidCount == null) r.paidCount = 0;
  }
}
function load() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch { return null; } }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('⚠ Sin espacio: quitá alguna foto o exportá una copia'); }
  scheduleCloudPush();
}

// ---------- Nube (Supabase) — Fase 4a: respaldo y sync del estado completo ----------
// El estado entero se guarda como una fila jsonb en public.app_state (RLS por usuario).
// La anon key se pega una vez en Config y vive en localStorage['gf-supa'] (nunca en el código ni en el export).
const SUPA_URL = 'https://lpdwtnzqtfjulsfmrnso.supabase.co';
let supa = (() => { try { return JSON.parse(localStorage.getItem('gf-supa')) || null; } catch { return null; } })();
// Si la configuración guardada es de otro proyecto (pasó en la migración del 2026-07-24),
// se descarta sola: ni la clave ni los tokens de un proyecto sirven en otro, y quedarse
// con los viejos deja la app "conectada" contra un servidor que ya no es el suyo.
// Las configuraciones viejas no guardaban `url`: se tratan como de otro proyecto (lo
// único que cuesta es volver a pegar la clave; el estado local no se toca).
let supaMudanza = false;
if (supa && supa.url !== SUPA_URL) { supa = null; supaMudanza = true; localStorage.removeItem('gf-supa'); }
function saveSupa() {
  if (supa) { supa.url = SUPA_URL; localStorage.setItem('gf-supa', JSON.stringify(supa)); }
  else localStorage.removeItem('gf-supa');
}
let cloudStatus = supa?.refresh_token ? 'idle' : 'off'; // off | idle | sync | ok | error
let cloudMsg = '';
function setCloudStatus(s, msg) {
  cloudStatus = s; cloudMsg = msg || '';
  const el = $('#cloudStatus'); if (el) el.innerHTML = cloudStatusLabel();
}
function cloudStatusLabel() {
  const last = supa?.lastSync ? ' · última sync ' + agoLabel(supa.lastSync) : '';
  return { off: 'Sin configurar', idle: `Conectado como <b>${esc(supa?.email || '')}</b>${last}`,
    sync: 'Sincronizando…', ok: `✓ Sincronizado · <b>${esc(supa?.email || '')}</b>${last}`,
    error: `⚠ ${esc(cloudMsg || 'Error de sincronización')} — los datos siguen guardados en este dispositivo` }[cloudStatus] || '';
}
const jwtSub = t => { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub; } catch { return null; } };
async function supaRefresh() {
  try {
    const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST', headers: { apikey: supa.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: supa.refresh_token }) });
    if (!res.ok) return false;
    const j = await res.json();
    supa.access_token = j.access_token; supa.refresh_token = j.refresh_token; saveSupa();
    return true;
  } catch { return false; }
}
async function supaFetch(path, opts = {}, retry = true) {
  const headers = { apikey: supa.key, 'Content-Type': 'application/json', Authorization: 'Bearer ' + supa.access_token, ...(opts.headers || {}) };
  const res = await fetch(SUPA_URL + path, { ...opts, headers });
  if (res.status === 401 && retry && supa.refresh_token && await supaRefresh()) return supaFetch(path, opts, false);
  return res;
}
async function cloudLogin(email, password) {
  const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
    method: 'POST', headers: { apikey: supa.key, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error_description || j.msg || 'No se pudo iniciar sesión');
  supa.access_token = j.access_token; supa.refresh_token = j.refresh_token;
  supa.email = email; supa.user_id = j.user?.id || jwtSub(j.access_token);
  saveSupa();
}
const cloudReady = () => !!(supa && supa.key && supa.refresh_token);
function cloudLoginModal() {
  openModal({ title: 'Conectar con la nube',
    body: `<div class="field"><label>Email</label><input id="clEmail" type="email" value="${esc(supa?.email || 'juan@mindlinkautomations.com')}"></div>
      <div class="field"><label>Contraseña</label><input id="clPass" type="password" placeholder="••••••••"></div>
      <div class="hint">Es tu cuenta del proyecto en Supabase (no el PIN de la app). Si no le pusiste contraseña al crear el usuario, definila en el panel de Supabase → Authentication → Users.</div>
      <div class="modal-actions"><button class="btn" id="okLogin">Entrar</button></div>`,
    onOpen: () => $('#okLogin').onclick = async () => {
      const email = $('#clEmail').value.trim(), pass = $('#clPass').value;
      if (!email || !pass) return toast('Completá email y contraseña');
      const btn = $('#okLogin'); btn.disabled = true; btn.textContent = 'Conectando…';
      try {
        await cloudLogin(email, pass);
        closeModal();
        await cloudInit();
        toast(cloudStatus === 'error' ? 'Conectado, pero no se pudo bajar tus datos — reintentá con conexión' : 'Conectado ✓');
        render();
      } catch (e) { btn.disabled = false; btn.textContent = 'Entrar'; toast(e.message || 'No se pudo conectar'); }
    } });
}
async function cloudPull() { // → {data, updated_at} | null (sin fila) | undefined (error)
  try {
    const res = await supaFetch('/rest/v1/app_state?select=data,updated_at&limit=1');
    if (!res.ok) return undefined;
    const rows = await res.json();
    return rows.length ? rows[0] : null;
  } catch { return undefined; }
}
// Un movimiento que viene de otro lado puede usar una billetera, unidad o categoría que acá
// todavía no existe: el bot las crea por chat ("crear_billetera"), y la app las puede crear
// sin señal. Los saldos se DERIVAN recorriendo las billeteras y unidades que existen, así que
// un posting que apunta a algo ausente no se suma en ningún lado: la plata desaparece del
// total sin ningún aviso. Por eso, junto con el movimiento se trae lo que necesita para vivir.
function adoptEntities(movs, desde) {
  const traer = (coll, id) => {
    if (!id || !Array.isArray(desde?.[coll]) || !Array.isArray(state[coll])) return;
    if (state[coll].some(x => x.id === id)) return;
    const orig = desde[coll].find(x => x.id === id);
    if (!orig) return;
    state[coll].push(orig);
    if (orig.parentId) traer(coll, orig.parentId); // la madre / la marca también, o queda huérfana
  };
  for (const m of movs) {
    traer('categories', m.categoryId);
    for (const p of (m.postings || [])) { traer('wallets', p.walletId); traer('units', p.unitId); }
  }
}
// Incorpora movimientos que están en la nube y no acá (los que carga el bot de Telegram).
// Solo agrega: nunca borra nada local, así un push viejo no puede hacer desaparecer datos.
function mergeRemoteMovements(remote) {
  if (!remote || !Array.isArray(remote.movements)) return 0;
  const tengo = new Set(state.movements.map(m => m.id));
  const nuevos = remote.movements.filter(m => m && m.id && !tengo.has(m.id));
  if (!nuevos.length) return 0;
  adoptEntities(nuevos, remote);
  state.movements.push(...nuevos);
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
  return nuevos.length;
}
// Lo que se cargó en ESTE dispositivo y la nube todavía no tiene (típico: gastos cargados
// sin señal, que nunca se llegaron a subir).
function localOnlyMovements(remote) {
  const alla = new Set((remote?.movements || []).map(m => m && m.id));
  return (state.movements || []).filter(m => m && m.id && !alla.has(m.id));
}
// Reemplaza el estado local por el de la nube SIN perder lo que solo existía acá.
// Antes esto era `state = row.data` a secas, y ahí estaba el agujero: si el bot había cargado
// algo (nube más nueva) y en el celular se habían cargado gastos sin señal, esos gastos
// desaparecían de la app al reabrirla con internet. Devuelve cuántos movimientos se rescataron.
function adoptCloudState(remote) {
  const previo = state;
  const rescatados = localOnlyMovements(remote);
  state = remote;
  migrate();
  if (rescatados.length) {
    adoptEntities(rescatados, previo); // se traen con su billetera/unidad/categoría
    state.movements.push(...rescatados);
  }
  return rescatados.length;
}
async function cloudPush() {
  if (!cloudReady()) return false;
  setCloudStatus('sync');
  try {
    const uid = supa.user_id || jwtSub(supa.access_token);
    // Si la nube cambió después de nuestra última sync (ej. el bot cargó un gasto),
    // hay que traerlo antes de subir: si no, este push lo pisaría.
    const row = await cloudPull();
    if (row && (!supa.lastSync || new Date(row.updated_at).getTime() > new Date(supa.lastSync).getTime())) {
      if (mergeRemoteMovements(row.data)) render();
    }
    const res = await supaFetch('/rest/v1/app_state?on_conflict=user_id', {
      method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ user_id: uid, data: state, updated_at: new Date().toISOString() }) });
    if (!res.ok) { setCloudStatus('error', 'No se pudo subir (' + res.status + ')'); return false; }
    supa.lastSync = new Date().toISOString(); saveSupa(); setCloudStatus('ok');
    return true;
  } catch { setCloudStatus('error', 'Sin conexión'); return false; }
}
let pushTimer = null;
function scheduleCloudPush() { if (!cloudReady()) return; clearTimeout(pushTimer); pushTimer = setTimeout(cloudPush, 1500); }
// Cuánto "contenido" tiene un estado — sirve para no reemplazar a ciegas datos cargados a mano.
function stateSize(s) {
  if (!s) return 0;
  return ['movements', 'debts', 'payplans', 'goals', 'recurring', 'budgets']
    .reduce((n, k) => n + (Array.isArray(s[k]) ? s[k].length : 0), 0);
}
function stateResumen(s) {
  const n = k => (Array.isArray(s?.[k]) ? s[k].length : 0);
  return [[n('movements'), 'movimiento'], [n('debts'), 'deuda'], [n('recurring'), 'recurrente'],
    [n('payplans'), 'plan de pago'], [n('goals'), 'meta']]
    .filter(([c]) => c > 0)
    .map(([c, l]) => `${c} ${l}${c > 1 ? (l.endsWith('l') ? 'es' : 's') : ''}`).join(' · ') || 'sin datos';
}
// Primer login en un dispositivo que YA tiene datos cargados: la fecha no alcanza para
// decidir (la nube puede ser más nueva pero tener menos). Que elija el usuario.
function syncChoiceModal(row) {
  const local = stateResumen(state), nube = stateResumen(row.data);
  openModal({ title: '¿Con cuáles nos quedamos?',
    body: `<div class="hint" style="margin-top:0">Este dispositivo y la nube tienen datos distintos. Elegí cuáles conservar — <b>lo otro se reemplaza</b>.</div>
      <div class="field"><label>📱 En este dispositivo</label><div>${esc(local)}</div></div>
      <div class="field"><label>☁️ En la nube (última vez: ${esc(fmtDate(row.updated_at.slice(0, 10)))})</label><div>${esc(nube)}</div></div>
      <div class="hint">Igual se guarda una copia de rescate de lo que haya en este dispositivo.</div>
      <div class="modal-actions"><button class="btn ghost" id="syncDown">Usar los de la nube</button><button class="btn" id="syncUp">Usar los de este dispositivo</button></div>`,
    onOpen: () => {
      $('#syncUp').onclick = async () => { closeModal(); await cloudPush(); toast('Se subieron los datos de este dispositivo'); };
      $('#syncDown').onclick = () => {
        try { localStorage.setItem('gf-backup', JSON.stringify({ at: new Date().toISOString(), state })); } catch {}
        state = row.data; migrate();
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
        supa.lastSync = new Date().toISOString(); saveSupa(); setCloudStatus('ok');
        closeModal(); render(); toast('Se bajaron los datos de la nube');
      };
    } });
}
// Al iniciar: si la nube tiene una versión más nueva que la última sync de este dispositivo, se baja; si no, se sube lo local.
async function cloudInit() {
  if (!cloudReady()) return;
  clearTimeout(pushTimer);
  setCloudStatus('sync');
  const row = await cloudPull();
  if (row === undefined) { setCloudStatus('error', 'No se pudo consultar la nube'); return; }
  // Preguntar antes de pisar nada si: es la primera sync de este dispositivo, o si la nube
  // trae MENOS contenido que lo que hay acá (pasa al cambiar de proyecto, o si otro
  // dispositivo subió una foto vieja). La fecha sola no alcanza: más nuevo ≠ más completo.
  if (row && stateSize(state) > 0 && stateSize(row.data) > 0 &&
      (!supa.lastSync || stateSize(row.data) < stateSize(state))) {
    setCloudStatus('idle');
    return syncChoiceModal(row);
  }
  if (row && (!supa.lastSync || new Date(row.updated_at).getTime() > new Date(supa.lastSync).getTime())) {
    // Copia de rescate antes de reemplazar lo local: si algo se cargó offline en este
    // dispositivo y la nube venía más nueva, no se pierde en silencio.
    try { localStorage.setItem('gf-backup', JSON.stringify({ at: new Date().toISOString(), state })); } catch {}
    const rescatados = adoptCloudState(row.data);
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
    supa.lastSync = new Date().toISOString(); saveSupa(); setCloudStatus('ok');
    render();
    // Lo que solo estaba en este dispositivo todavía no está en la nube: subirlo ahora,
    // así deja de depender de que alguien vuelva a tocar algo para que se guarde.
    if (rescatados) {
      await cloudPush();
      toast(`Se recuperaron ${rescatados} movimiento${rescatados > 1 ? 's' : ''} que estaban solo en este dispositivo`);
    }

// ---------- Nav: menú de "más vistas" cuando no entran todos los botones ----------
// El ancho que flexbox le da a .nav depende de su propio contenido, así que compararlo
// contra sí mismo (scrollWidth vs. clientWidth) es circular: al tapar un botón, .nav
// "necesita" menos y flexbox le da menos lugar, y el corte queda mal. En cambio calculamos
// el espacio disponible a partir de los hermanos de tamaño fijo de la barra (que no cambian
// con el contenido del nav) y decidimos cuántos botones entran con esa cuenta estable.
function closeNavMenu() { $('#navMenu')?.classList.remove('open'); }
let navWidths = null; // anchos naturales de cada botón + "⋯" (no cambian: mismo texto/fuente siempre)
function layoutNav() {
  const bar = $('.appbar-inner'), nav = $('.nav'), more = $('#navMore'), menu = $('#navMenu');
  if (!bar || !nav || !more || !menu) return;
  const btns = [...nav.querySelectorAll(':scope > button[data-view]')];
  if (!navWidths) {
    btns.forEach(b => b.classList.remove('is-overflow'));
    more.classList.add('show');
    navWidths = { btns: btns.map(b => b.getBoundingClientRect().width), more: more.getBoundingClientRect().width, gap: 2 };
    more.classList.remove('show');
  }
  const flowChildren = [...bar.children].filter(c => c !== menu); // #navMenu es position:fixed: no participa del flex ni del gap
  const siblings = flowChildren.filter(c => c !== nav && !c.classList.contains('spacer'));
  const siblingsWidth = siblings.reduce((s, c) => s + c.getBoundingClientRect().width, 0);
  const gaps = Math.max(0, flowChildren.length - 1) * 14; // gap:14px entre los hijos en flujo de .appbar-inner
  const navPad = 6; // .nav { padding: 3px } (3px a cada lado)
  const barPad = 40; // .appbar-inner { padding: 12px 20px } → clientWidth incluye el padding, hay que descontarlo
  const avail = bar.clientWidth - barPad - siblingsWidth - gaps - navPad;
  let used = 0, fit = 0;
  for (; fit < navWidths.btns.length; fit++) {
    const needsMore = fit < navWidths.btns.length - 1;
    const cost = navWidths.btns[fit] + (fit ? navWidths.gap : 0) + (needsMore ? navWidths.more + navWidths.gap : 0);
    if (used + cost > avail) break;
    used += navWidths.btns[fit] + (fit ? navWidths.gap : 0);
  }
  fit = Math.max(1, fit); // siempre queda al menos el botón activo/primero visible
  btns.forEach((b, i) => b.classList.toggle('is-overflow', i >= fit));
  more.classList.toggle('show', fit < btns.length);
  const overflowBtns = btns.slice(fit);
  more.classList.toggle('active', overflowBtns.some(b => b.classList.contains('active')));
  menu.innerHTML = overflowBtns.map(b => `<button data-view="${b.dataset.view}" class="${b.classList.contains('active') ? 'active' : ''}">${b.textContent}</button>`).join('');
  menu.querySelectorAll('button').forEach(b => b.onclick = () => setView(b.dataset.view));
}

// ---------- Insights: avisos que la app genera sola mirando los datos ----------
function ymOffset(off) {
  const d = new Date(now.getFullYear(), now.getMonth() + off, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function monthExpByCat(ym) {
  const map = {};
  for (const m of lensFilter(state.movements)) {
    if (m.type !== 'expense' || m.date.slice(0, 7) !== ym) continue;
    const top = catTop(m.categoryId); if (!top) continue;
    map[top.id] = (map[top.id] || 0) + movARS(m);
  }
  return map;
}
function insights() {
  const out = [];
  const curYM = todayISO().slice(0, 7);
  const cur = monthExpByCat(curYM);
  const prev = [ymOffset(-1), ymOffset(-2), ymOffset(-3)].map(monthExpByCat);
  // 1) Fugas: una categoría muy por encima de su promedio reciente
  for (const [catId, amt] of Object.entries(cur)) {
    const hist = prev.map(p => p[catId] || 0).filter(v => v > 0);
    if (hist.length < 2) continue;
    const avg = hist.reduce((s, v) => s + v, 0) / hist.length;
    if (amt > avg * 1.4 && amt - avg > 10000)
      out.push({ icon: '🚨', sev: 'neg', text: `<b>${esc(category(catId)?.name || '—')}</b> va ${fmt(amt)} este mes, ${Math.round((amt / avg - 1) * 100)}% arriba de tu promedio (${fmt(avg)})` });
  }
  // 2) Ritmo: proyección de fin de mes vs el mes pasado
  const t = new Date(), day = t.getDate(), dim = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  const curTotal = Object.values(cur).reduce((s, v) => s + v, 0);
  const lastTotal = Object.values(prev[0]).reduce((s, v) => s + v, 0);
  if (day >= 7 && lastTotal > 0 && curTotal / day * dim > lastTotal * 1.25)
    out.push({ icon: '📈', sev: 'warn', text: `A este ritmo terminás el mes gastando <b>${fmt(curTotal / day * dim)}</b> (el mes pasado: ${fmt(lastTotal)})` });
  // 3) Recurrentes que parecen duplicados (mismo nombre, o misma categoría y monto casi igual)
  const recs = state.recurring.filter(r => r.active && r.template.type === 'expense');
  for (let i = 0; i < recs.length; i++) for (let j = i + 1; j < recs.length; j++) {
    const a = recs[i], b = recs[j];
    const sameName = recName(a).trim().toLowerCase() === recName(b).trim().toLowerCase();
    const sameCatAmt = a.template.categoryId && a.template.categoryId === b.template.categoryId && Math.abs(a.template.amount - b.template.amount) <= a.template.amount * 0.02;
    if (sameName || sameCatAmt)
      out.push({ icon: '👯', sev: 'warn', text: `<b>${esc(recName(a))}</b> y <b>${esc(recName(b))}</b> parecen la misma suscripción cargada dos veces` });
  }
  // 4) Presupuestos al límite (mes actual real, no el período elegido)
  const monthList = lensFilter(state.movements).filter(m => m.date.slice(0, 7) === curYM);
  for (const b of state.budgets) {
    const spent = monthList.filter(m => m.type === 'expense' && m.categoryId && (m.categoryId === b.categoryId || category(m.categoryId)?.parentId === b.categoryId)).reduce((s, m) => s + movARS(m), 0);
    const pct = spent / b.amount;
    if (pct >= 1) out.push({ icon: '🎯', sev: 'neg', text: `Superaste el presupuesto de <b>${esc(catFullName(b.categoryId))}</b>: ${fmt(spent)} de ${fmt(b.amount)}` });
    else if (pct >= 0.85) out.push({ icon: '🎯', sev: 'warn', text: `Vas por el ${Math.round(pct * 100)}% del presupuesto de <b>${esc(catFullName(b.categoryId))}</b>` });
  }
  // 5) Días sin cargar nada (el hábito es la mitad del sistema)
  const lastMov = state.movements.reduce((mx, m) => m.date > mx ? m.date : mx, '');
  if (lastMov && daysUntil(lastMov) <= -5)
    out.push({ icon: '💤', sev: 'info', text: `Hace ${-daysUntil(lastMov)} días que no cargás movimientos` });
  return out.slice(0, 5);
}

function goalRow(g) {
  const pct = Math.min((g.saved || 0) / g.target * 100, 100), done = (g.saved || 0) >= g.target;
  return `<div class="row">
    <div class="avatar" style="background:${done ? 'var(--pos-soft)' : 'var(--surface-2)'}">${done ? '🏆' : '🎯'}</div>
    <div class="info"><div class="title">${esc(g.name)}${done ? ' <span class="badge" style="background:var(--pos-soft);color:var(--pos)">¡lograda!</span>' : ''}</div>
      <div class="io-track" style="margin-top:6px"><div class="io-fill" style="width:${pct}%;background:${done ? 'var(--pos)' : 'var(--brand)'}"></div></div>
      <div class="subtitle" style="margin-top:5px">${fmt(g.saved || 0)} de ${fmt(g.target)} · ${pct.toFixed(0)}%</div></div>
    ${!done ? `<button class="btn sm" data-goal-add="${g.id}">＋ Aportar</button>` : ''}
    <button class="btn ghost sm" data-goal-edit="${g.id}" title="Editar">✎</button>
    <button class="del" data-goal-del="${g.id}" title="Eliminar">✕</button>
  </div>`;
}
function goalsSectionHTML() {
  const rows = state.goals.map(goalRow).join('')

  const stepSel = `<select id="ruStep" style="padding:5px 8px;font-size:12.5px">${[[0, 'Apagado'], [100, 'al $100'], [500, 'al $500'], [1000, 'al $1.000']].map(([v, l]) => `<option value="${v}" ${(state.prefs.roundupStep || 0) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const goalSel = `<select id="ruGoal" style="padding:5px 8px;font-size:12.5px">${state.goals.map(g => `<option value="${g.id}" ${state.prefs.roundupGoal === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select>`;
  const roundup = state.goals.length ? `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-muted)">
    <span title="Cada gasto se redondea y el vuelto virtual va a la meta">🪙 Redondeo de gastos:</span>${stepSel}<span>→</span>${goalSel}</div>` : '';
  return section('dash-goals', 'Metas de ahorro', `<div class="card"><div class="list" style="padding:0">${rows}</div>${roundup}
    <div style="padding:12px 14px;border-top:1px solid var(--border)"><button class="btn ghost sm" id="addGoal">＋ Nueva meta</button></div></div>`);

function goalModal(id) {
  const g = id ? state.goals.find(x => x.id === id) : null;
  openModal({ title: g ? 'Editar meta' : 'Nueva meta de ahorro',
    body: `<div class="field"><label>Nombre</label><input id="gName" type="text" value="${esc(g?.name || '')}" placeholder="Ej: Vacaciones, Máquina nueva, Fondo de emergencia"></div>
      <div class="two"><div class="field"><label>Objetivo ($)</label><input id="gTarget" type="number" step="0.01" value="${g?.target ?? ''}" placeholder="0"></div>
        <div class="field"><label>Ya juntado ($)</label><input id="gSaved" type="number" step="0.01" value="${g?.saved ?? 0}"></div></div>
      <div class="modal-actions"><button class="btn" id="okGoal">Guardar</button></div>`,
    onOpen: () => { $('#okGoal').onclick = () => {
      const name = $('#gName').value.trim(); if (!name) return toast('Poné un nombre');
      const target = parseFloat($('#gTarget').value); if (!target || target <= 0) return toast('Poné el objetivo');
      const saved = Math.max(0, parseFloat($('#gSaved').value) || 0);
      if (g) Object.assign(g, { name, target, saved });
      else state.goals.push({ id: uid(), name, target, saved, createdAt: todayISO() });
      save(); closeModal(); render(); toast('Meta guardada');
    }; } });
}
function goalAddModal(id) {
  const g = state.goals.find(x => x.id === id); if (!g) return;
  openModal({ title: `Aportar a «${esc(g.name)}»`,
    body: `<div class="hint" style="margin-top:0">Llevás <b>${fmt(g.saved || 0)}</b> de ${fmt(g.target)}. Faltan ${fmt(Math.max(0, g.target - (g.saved || 0)))}.</div>
      <div class="field"><label>Monto</label><input id="gAmt" type="number" step="0.01" placeholder="0" style="font-size:20px;font-weight:700;text-align:center"></div>
      <div class="modal-actions"><button class="btn" id="okGAdd">Aportar</button></div>`,
    onOpen: () => { $('#okGAdd').onclick = () => {
      const v = parseFloat($('#gAmt').value); if (!v || v <= 0) return toast('Ingresá un monto');
      g.saved = r2((g.saved || 0) + v); save(); closeModal(); render();
      toast(g.saved >= g.target ? '🏆 ¡Meta lograda!' : 'Aporte registrado');
    }; } });
}

}

// opts.rec=true → muestra el toggle de conciliación (solo en la vista Movimientos).
function movementRow(m, opts = {}) {
  const cat = category(m.categoryId);
  let icon, cls, sign, title, subtitle;
  if (m.type === 'income') {
    icon = '＋'; cls = 'pos'; sign = '+'; title = m.note || (cat ? cat.name : 'Ingreso');
    const p = m.postings[0];
    subtitle = `${cat ? esc(catFullName(m.categoryId)) + ' · ' : ''}${esc(wallet(p.walletId)?.name || '—')} · <span class="badge unit">${esc(unit(p.unitId)?.name || '')}</span>`;
  } else if (m.type === 'expense') {
    icon = '－'; cls = 'neg'; sign = '−'; title = m.note || (cat ? cat.name : 'Gasto');
    const p = m.postings[0];
    subtitle = `${cat ? esc(catFullName(m.categoryId)) + ' · ' : ''}${esc(wallet(p.walletId)?.name || '—')} · <span class="badge unit">${esc(unit(p.unitId)?.name || '')}</span>`;
  } else {
    icon = '⇄'; cls = 'tr'; sign = '';
    const from = m.postings.find(p => p.amount < 0), to = m.postings.find(p => p.amount > 0);

    title = sameWallet
      ? `${esc(unit(from.unitId)?.name)} → ${esc(unit(to.unitId)?.name)}`

  const col = m.type === 'income' ? 'var(--pos)' : m.type === 'expense' ? 'var(--neg)' : 'var(--transfer)';

      <div class="avatar" style="background:${bg};color:${col};font-weight:700">${icon}</div>

      </div>
      <div class="amt ${cls}">${sign}${fmtCur(m.amount, movCur(m)).replace('-', '')}</div>

// ---------- Vista: Calendario ----------
function renderCalendar() {
  const first = new Date(period.y, period.m, 1);
  const startDow = (first.getDay() + 6) % 7; // Lunes = 0
  const days = new Date(period.y, period.m + 1, 0).getDate();
  const byDay = {};
  for (const m of lensFilter(periodMovements())) {
    const d = parseInt(m.date.slice(8, 10), 10);
    (byDay[d] = byDay[d] || { inc: 0, exp: 0 });
    if (m.type === 'income') byDay[d].inc += movARS(m);
    else if (m.type === 'expense') byDay[d].exp += movARS(m);
  }
  const isCurMonth = period.y === now.getFullYear() && period.m === now.getMonth();
  let cells = '';
  for (let i = 0; i < startDow; i++) cells += `<div class="cal-cell empty-cell"></div>`;
  for (let d = 1; d <= days; d++) {
    const info = byDay[d];
    const today = isCurMonth && d === now.getDate();
    cells += `
      <div class="cal-cell ${info ? 'filled' : ''} ${today ? 'today' : ''}" ${info ? `data-day="${d}"` : ''}>
        <span class="d">${d}</span>
        <div class="amts">
          ${info && info.inc ? `<span class="ci">+${fmtShort(info.inc)}</span>` : ''}
          ${info && info.exp ? `<span class="ce">−${fmtShort(info.exp)}</span>` : ''}
        </div>
      </div>`;
  }
  const { inc, exp } = summaryFor(lensFilter(periodMovements()));
  const root = $('#view-calendar');
  root.innerHTML = `
    <div class="toolbar">${periodNavHTML()}<div class="spacer" style="flex:1"></div>
      <span class="badge" style="background:var(--pos-soft);color:var(--pos)">Ingresos ${fmt(inc)}</span>
      <span class="badge" style="background:var(--neg-soft);color:var(--neg)">Gastos ${fmt(exp)}</span>
    </div>
    <div class="card" style="padding:14px">
      <div class="cal-head"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div>
      <div class="cal-grid">${cells}</div>
    </div>`;
  wirePeriod(root);
  root.querySelectorAll('[data-day]').forEach(c => c.onclick = () => {
    const d = String(c.dataset.day).padStart(2, '0');
    dayModal(`${period.y}-${String(period.m + 1).padStart(2, '0')}-${d}`);
  });
}

function dayModal(dateISO) {
  const list = state.movements.filter(m => m.date === dateISO).sort((a, b) => a.id.localeCompare(b.id));
  const rows = list.map(m => movementRow(m)).join('') || emptyBox('—', 'Sin movimientos este día');
  openModal({
    title: new Date(dateISO + 'T00:00:00').toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' }),
    body: `<div class="list" style="margin:-6px -6px 12px">${rows}</div>
      <div class="modal-actions"><button class="btn" id="addDay">＋ Agregar en este día</button></div>`,
    onOpen: () => { $('#addDay').onclick = () => { closeModal(); movementModal(dateISO); }; }
  });
}

// ---------- Vista: Estadísticas ----------
// Agrupa gastos por categoría PRINCIPAL (las subcategorías suman a su madre);
// cada entrada lleva `subs` = desglose interno {catId: monto} para mostrar el detalle.
function expenseByCat(list) {
  const map = {}, subs = {};
  list.filter(m => m.type === 'expense').forEach(m => {
    const top = catTop(m.categoryId), k = top ? top.id : '__none';
    map[k] = (map[k] || 0) + movARS(m);
    (subs[k] = subs[k] || {})[m.categoryId || '__none'] = (subs[k][m.categoryId || '__none'] || 0) + movARS(m);
  });
  let arr = Object.entries(map).map(([k, v]) => ({ id: k, name: k === '__none' ? 'Sin categoría' : (category(k)?.name || '—'), amount: v, subs: subs[k] })).sort((a, b) => b.amount - a.amount);
  const top = arr.slice(0, 8), rest = arr.slice(8);
  top.forEach((d, i) => d.color = `var(--s${i + 1})`);
  if (rest.length) top.push({ id: '__other', name: 'Otros', amount: rest.reduce((s, d) => s + d.amount, 0), color: 'var(--s-other)' });
  return top;
}

function donutSVG(data, cap = 'gastos') {
  const total = data.reduce((s, d) => s + d.amount, 0);
  if (total <= 0) return '';
  const C = 2 * Math.PI * 50; let off = 0;
  const segs = data.map(d => {
    const frac = d.amount / total;
    const len = Math.max(frac * C - 2, 0.5);
    const seg = `<circle cx="60" cy="60" r="50" fill="none" stroke="${d.color}" stroke-width="16" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"><title>${esc(d.name)}: ${fmt(d.amount)} (${(frac * 100).toFixed(1)}%)</title></circle>`;
    off += frac * C;
    return seg;
  }).join('');
  return `<svg viewBox="0 0 120 120" class="donut">${segs}
    <text x="60" y="57" text-anchor="middle" class="donut-total">${fmtShort(total)}</text>
    <text x="60" y="70" text-anchor="middle" class="donut-cap">gastos</text></svg>`;
}

// ---------- Tendencia de patrimonio ----------
function netWorthSeries(months) {
  const ids = lensIds(); // bajo lente: solo la parte del grupo elegido
  const totalOpening = state.wallets.reduce((s, w) => s + ((!ids || ids.has(w.openingUnit)) ? toARS(w.opening || 0, w.currency) : 0), 0);
  const out = [];
  for (let i = months - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i + 1, 0); // último día del mes
    const end = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    let v = totalOpening;
    for (const m of state.movements) if (m.date <= end) for (const p of m.postings) if (!ids || ids.has(p.unitId)) v += postingARS(p);
    out.push({ label: d.toLocaleDateString('es-AR', { month: 'short' }), value: v });
  }
  return out;
}
let trendGeo = null;
function computeTrendGeo(series) {
  const W = 320, H = 150, padX = 10, padTop = 14, padBot = 22, n = series.length;
  const xs = series.map((_, i) => n > 1 ? padX + i * (W - 2 * padX) / (n - 1) : W / 2);
  const vals = series.map(s => s.value); let min = Math.min(...vals), max = Math.max(...vals); if (min === max) { min -= 1; max += 1; }
  const y = v => padTop + (H - padTop - padBot) * (1 - (v - min) / (max - min));
  return { W, H, padTop, padBot, xs, ys: series.map(s => y(s.value)), series };
}
function trendChartHTML(g) {
  const line = g.xs.map((x, i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + g.ys[i].toFixed(1)).join(' ');
  const area = line + ` L ${g.xs[g.xs.length - 1].toFixed(1)} ${g.H - g.padBot} L ${g.xs[0].toFixed(1)} ${g.H - g.padBot} Z`;
  const step = Math.ceil(g.series.length / 6);
  const labels = g.series.map((s, i) => (i % step === 0 || i === g.series.length - 1) ? `<text class="trend-axis" x="${g.xs[i].toFixed(1)}" y="${g.H - 6}" text-anchor="middle">${s.label}</text>` : '').join('');
  return `<div class="trend-wrap" style="position:relative">
    <svg class="trend" id="trendSvg" viewBox="0 0 ${g.W} ${g.H}" preserveAspectRatio="none">
      <path class="area" d="${area}" fill="var(--s1)"></path>
      <path class="line" d="${line}" stroke="var(--s1)" vector-effect="non-scaling-stroke"></path>
      <line class="cross" id="trendCross" vector-effect="non-scaling-stroke" style="display:none"></line>
      ${labels}
    </svg>
    <div class="trend-tip" id="trendTip"></div>
  </div>`;
}
function wireTrend(root) {
  const g = trendGeo; if (!g) return;
  const svg = root.querySelector('#trendSvg'), cross = root.querySelector('#trendCross'), tip = root.querySelector('#trendTip');
  if (!svg) return;
  function show(clientX) {
    const rect = svg.getBoundingClientRect();
    const vx = (clientX - rect.left) / rect.width * g.W;
    let idx = 0, best = 1e9; g.xs.forEach((x, i) => { const d = Math.abs(x - vx); if (d < best) { best = d; idx = i; } });
    const s = g.series[idx];
    cross.setAttribute('x1', g.xs[idx]); cross.setAttribute('x2', g.xs[idx]); cross.setAttribute('y1', g.padTop); cross.setAttribute('y2', g.H - g.padBot); cross.style.display = '';
    tip.style.left = (g.xs[idx] / g.W * rect.width) + 'px';
    tip.style.top = (g.ys[idx] / g.H * rect.height) + 'px';
    tip.textContent = s.label + ': ' + fmt(s.value); tip.style.opacity = '1';
  }
  svg.addEventListener('mousemove', e => show(e.clientX));
  svg.addEventListener('touchmove', e => { show(e.touches[0].clientX); e.preventDefault(); });
  svg.addEventListener('mouseleave', () => { cross.style.display = 'none'; tip.style.opacity = '0'; });
}

// Simulador: cuánto cambia el patrimonio si ahorrás (o gastás) distinto cada mes.
function simModal() {
  const t = new Date();
  let sum = 0, n = 0;
  for (let i = 1; i <= 6; i++) {
    const d = new Date(t.getFullYear(), t.getMonth() - i, 1);
    const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    const s = summaryFor(lensFilter(state.movements).filter(m => m.date.slice(0, 7) === ym));
    sum += s.inc - s.exp; n++;
  }
  const avg = n ? sum / n : 0;
  const base = lensUnit() ? unitGroupBalance(lens) : netWorthARS();
  openModal({ title: '🔮 ¿Qué pasaría si…?',
    body: `<div class="hint" style="margin-top:0">Tu resultado promedio de los últimos 6 meses es <b style="color:${avg >= 0 ? 'var(--pos)' : 'var(--neg)'}">${fmt(avg)}</b> por mes. Probá cuánto cambia tu patrimonio si ahorrás (o gastás) distinto.</div>
      <div class="field"><label>Cambio por mes (＋ ahorro extra · − gasto extra)</label><input id="simExtra" type="number" step="1000" value="0" style="font-size:20px;font-weight:700;text-align:center"></div>
      <div id="simOut"></div>`,
    onOpen: () => {
      const upd = () => {
        const extra = parseFloat($('#simExtra').value) || 0;
        const mensual = avg + extra;
        $('#simOut').innerHTML = [6, 12, 24].map(mm => `<div style="display:flex;justify-content:space-between;padding:9px 4px;border-top:1px solid var(--border)">
          <span>En ${mm} meses</span><b style="color:${mensual >= 0 ? 'var(--pos)' : 'var(--neg)'}">${fmt(base + mensual * mm)}</b></div>`).join('')
          + `<div class="hint">Partiendo de tu patrimonio neto actual (${fmt(base)}), a valores de hoy.</div>`;
      };
      $('#simExtra').oninput = upd; upd();
    } });
}

// ---------- Vista: Negocios (resultado por unidad) ----------
function unitPnL(unitId, list) {
  let inc = 0, exp = 0;
  for (const m of list) {
    if (m.postings[0]?.unitId !== unitId) continue;
    if (m.type === 'income') inc += movARS(m);
    else if (m.type === 'expense') exp += movARS(m);
  }
  return { inc, exp };
}
function unitTransfersAllTime(unitId) {
  let out = 0, inn = 0;
  for (const m of state.movements) {
    if (m.type !== 'transfer') continue;
    const f = m.postings.find(p => p.amount < 0), t = m.postings.find(p => p.amount > 0);
    if (!f || !t || f.unitId === t.unitId) continue;
    if (f.unitId === unitId) out += Math.abs(postingARS(f));
    if (t.unitId === unitId) inn += postingARS(t);
  }
  return { out, inn };
}
// Tarjeta de resultado de UNA unidad (su propio P&L, sin sumar sub-negocios).
// Compacta a propósito (clave en mobile): nombre + saldo + resultado. El resto del detalle
// (bars, transfers acumulados, histórico, facturación) vive en unitDetailModal, al tocar.
// isMember=true → estilo compacto para ir anidada dentro del bloque de su marca.
function unitCard(u, list, isMember = false) {
  const { inc, exp } = unitPnL(u.id, list), res = inc - exp;
  const bal = unitBalance(u.id), biz = u.kind === 'business';
  const wrap = isMember
    ? 'style="padding:14px;margin-bottom:10px;background:var(--surface-2);border-radius:12px;cursor:pointer"'
    : 'class="card" style="padding:16px;margin-bottom:14px;cursor:pointer"';
  return `<div ${wrap} data-unit-card="${u.id}" title="Tocá para ver el detalle">

// ---------- Vista: Deudas ----------
// ---------- Planes de pago (dividir deudas que debo en cuotas, con interés opcional) ----------
// Un plan referencia ítems de deuda (misma moneda) y NO duplica saldos: cada cuota pagada
// abona el capital proporcionalmente contra los ítems; el interés es costo extra del plan.
const r2 = n => Math.round(n * 100) / 100;
const planActive = p => (p.paidCount || 0) < p.installments;
const debtInPlan = id => (state.payplans || []).some(p => planActive(p) && p.debtIds.includes(id));
const planCuota = p => r2(p.total / p.installments);
const planFreqLabel = { monthly: 'mensual', biweekly: 'quincenal', weekly: 'semanal' };
function advancePlanDate(iso, freq) {
  if (freq === 'weekly' || freq === 'biweekly') {
    const [y, m, dd] = iso.split('-').map(Number);
    return isoOf(new Date(y, m - 1, dd + (freq === 'weekly' ? 7 : 14)));
  }
  return advanceDate(iso, 'monthly');
}
function planNextDate(p) {
  let d = p.firstDate;
  for (let i = 0; i < (p.paidCount || 0); i++) d = advancePlanDate(d, p.freq);
  return d;
}

// ---------- Flujo de caja de deudas: cuánto hay que pagar/cobrar por semana ----------
// Junta deudas sueltas con vencimiento (fuera de un plan) + cuotas proyectadas de planes activos,
// bucketizado por semana (lunes a domingo), para responder "¿cuánto necesito esta semana?".
function weekStartISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const dow = (dt.getDay() + 6) % 7; // 0 = lunes
  dt.setDate(dt.getDate() - dow);
  return isoOf(dt);
}
function upcomingDebtBuckets(weeks = 8) {
  const start = weekStartISO(todayISO());
  const buckets = [];
  for (let i = 0; i < weeks; i++) {
    const [y, m, d] = start.split('-').map(Number);
    const s = isoOf(new Date(y, m - 1, d + i * 7)), e = isoOf(new Date(y, m - 1, d + i * 7 + 6));
    buckets.push({ key: s, start: s, end: e, payARS: 0, collectARS: 0, items: [] });
  }
  const lastEnd = buckets[buckets.length - 1].end;
  const put = (dateIso, item) => {
    if (dateIso > lastEnd) return;
    const b = buckets.find(x => dateIso >= x.start && dateIso <= x.end);
    if (!b) return;
    if (item.type === 'expense') b.payARS += item.ars; else b.collectARS += item.ars;
    b.items.push(item);
  };
  for (const d of state.debts) {
    if (debtRemaining(d) <= 0.005 || !d.dueDate || debtInPlan(d.id)) continue;
    const owe = debtDir(d) === 'owe';
    put(d.dueDate, { name: `${d.person}${d.name ? ' · ' + d.name : ''}`, amount: debtRemaining(d), cur: d.currency,
      ars: debtRemainingARS(d), type: owe ? 'expense' : 'income', date: d.dueDate });
  }
  for (const p of state.payplans || []) {
    if (!planActive(p)) continue;
    let date = planNextDate(p), paid = p.paidCount || 0, guard = 0;
    while (date <= lastEnd && paid < p.installments && guard < 200) {
      put(date, { name: `${p.name} · cuota ${paid + 1}/${p.installments}`, amount: planCuota(p), cur: p.currency,
        ars: toARS(planCuota(p), p.currency), type: 'expense', date });
      paid++; date = advancePlanDate(date, p.freq); guard++;
    }
  }
  buckets.forEach(b => b.items.sort((a, c) => a.date.localeCompare(c.date)));
  return buckets;
}
function debtCashflowModal(key) {
  const b = upcomingDebtBuckets(12).find(x => x.key === key); if (!b) return;
  const rows = b.items.map(i => `<div class="row">
      <div class="avatar" style="background:var(--surface-2)">${i.type === 'income' ? '🤝' : '💳'}</div>

      <div class="amt" style="color:${i.type === 'income' ? 'var(--pos)' : 'var(--neg)'}">${fmtCur(i.amount, i.cur)}</div>
    </div>`).join('') || emptyBox('—', 'Nada previsto esta semana');
  openModal({ title: `Semana del ${fmtDate(b.start)}`,
    body: `<div class="list" style="margin:-6px -6px 10px">${rows}</div>

      ${b.collectARS > 0.005 ? `<div style="display:flex;justify-content:space-between;padding:0 4px 6px;color:var(--text-muted)"><span>Total a cobrar</span><span style="color:var(--pos)">${fmt(b.collectARS)}</span></div>` : ''}` });
}
function payPlanInstallment(id) {
  const p = state.payplans.find(x => x.id === id); if (!p || !planActive(p)) return;
  const cuota = planCuota(p), n = (p.paidCount || 0) + 1;
  const cw = state.wallets.filter(w => walletCur(w.id) === p.currency);
  if (!cw.length) return toast(`No tenés ninguna billetera en ${p.currency} para registrar el pago`);
  const w0 = cw[0].id, u0 = lensUnit() ? lens : state.units[0]?.id;
  openModal({ title: `Pagar cuota ${n}/${p.installments}`,
    body: `<div class="hint" style="margin-top:0">Cuota <b>${fmtCur(cuota, p.currency)}</b> de <b>${esc(p.name)}</b>.</div>
      <div class="two"><div class="field"><label>Sale de</label><select id="planPayWallet">${walletOptionsCur(p.currency, w0)}</select></div>
        <div class="field"><label>Unidad</label><select id="planPayUnit">${unitOptions(u0)}</select></div></div>
      <div class="hint">Se registra como un gasto en esa billetera, además de bajar el capital de las deudas del plan.</div>
      <div class="modal-actions"><button class="btn" id="okPlanPay">Registrar pago</button></div>`,
    onOpen: () => {
      $('#okPlanPay').onclick = () => {
        const walletId = $('#planPayWallet').value, unitId = $('#planPayUnit').value;
        let restante = r2(p.capital / p.installments); // a las deudas va el capital; el interés no es deuda anotada
        const items = p.debtIds.map(i => state.debts.find(d => d.id === i)).filter(Boolean);
        for (const d of items) {
          if (restante <= 0) break;
          const aplica = Math.min(debtRemaining(d), restante);
          d.paid = r2((d.paid || 0) + aplica); restante = r2(restante - aplica);
        }
        p.paidCount = (p.paidCount || 0) + 1;
        if (!planActive(p)) items.forEach(d => { d.paid = d.amount; }); // última cuota: saldar exacto (evita restos por redondeo)
        state.movements.push({ id: uid(), type: 'expense', amount: cuota, date: todayISO(), categoryId: null,
          note: `Cuota ${n}/${p.installments} · ${p.name}`, source: 'manual', attachment: null,
          postings: [{ walletId, unitId, amount: -cuota }] });
        save(); closeModal(); render();
        toast(planActive(p) ? `Cuota ${p.paidCount}/${p.installments} pagada` : 'Plan completado 🎉 Deudas saldadas');
      };
    } });
}

      <div id="planPreview" class="hint"></div>

    onOpen: () => {

      const upd = () => {

      };

        save(); closeModal(); render(); toast('Plan de pago creado');

// Fila de un ítem de deuda/acreencia (dentro del bloque de su persona).
function debtRow(d) {
  const rem = debtRemaining(d), done = rem <= 0.005, owe = debtDir(d) === 'owe';
  const overdue = !done && d.dueDate && d.dueDate < todayISO();
  const inPlan = !done && debtInPlan(d.id);
  const badges = `${overdue ? `<span class="badge" style="background:var(--neg-soft);color:var(--neg)">${owe ? 'vencida' : 'a cobrar vencido'}</span>` : ''}${done ? `<span class="badge" style="background:var(--pos-soft);color:var(--pos)">${owe ? 'saldada' : 'cobrada'}</span>` : ''}${inPlan ? '<span class="badge">📅 en plan</span>' : ''}`;
  const title = d.name || d.note || (owe ? 'Deuda' : 'Préstamo');

  return `<div class="row">
    <div class="avatar" style="background:${done ? 'var(--pos-soft)' : (owe ? 'var(--neg-soft)' : 'var(--pos-soft)')};color:${done ? 'var(--pos)' : (owe ? 'var(--neg)' : 'var(--pos)')};font-weight:700">${done ? '✓' : (owe ? '💳' : '🤝')}</div>

    ${d.attachment ? `<button class="clip" data-photo-debt="${d.id}" title="Ver comprobante">📎</button>` : ''}
    ${!done && !inPlan ? `<button class="btn sm" data-pay="${d.id}">${owe ? 'Pagar' : 'Cobrar'}</button>` : ''}
    <button class="btn ghost sm" data-edit-debt="${d.id}" title="Editar">✎</button>
    <button class="del" data-del-debt="${d.id}" title="Eliminar">✕</button>
  </div>`;
}

  const personBlocks = Object.entries(persons).sort((a, b) => {

  }).map(([name, items]) => {

    const net = owedP - oweP, pend = items.filter(d => debtRemaining(d) > 0.005).length;
    const summary = [

    ].filter(Boolean).join(' · ') || 'todo saldado ✓';
    return `<div class="card" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex-wrap:wrap">

  const planCards = (state.payplans || []).map(p => {

  const root = $('#view-debts');

      <div class="card stat"><div class="top"><span class="dot" style="background:var(--pos)"></span><span class="name">Te deben</span></div>
        <div class="amount" style="color:${owedARS > 0.005 ? 'var(--pos)' : 'inherit'}">${fmt(owedARS)}</div>

    </div>
    <div class="grid cols-2">
      <div class="card stat"><div class="top"><span class="dot" style="background:var(--pos)"></span><span class="name">Activos (billeteras)</span></div>

      <div class="card stat"><div class="top"><span class="dot" style="background:${neto >= 0 ? 'var(--brand)' : 'var(--neg)'}"></span><span class="name">Patrimonio neto</span></div>
        <div class="amount" style="color:${neto < 0 ? 'var(--neg)' : 'inherit'}">${fmt(neto)}</div><div class="meta">activos + te deben − debés</div></div>
    </div>
    ${section('debt-cashflow', 'Próximos pagos · cuánto necesitás y cuándo', `<div class="card list">${cashRows || emptyBox('🙌', 'Nada previsto en las próximas semanas')}</div>`)}
    <div class="toolbar" style="margin-top:8px"><h2 class="section" style="margin:0">Planes de pago</h2><div style="flex:1"></div><button class="btn ghost sm" id="addPlan">＋ Nuevo plan</button></div>
    ${planCards || `<div class="hint" style="margin:0 2px 6px">Agrupá deudas que debés y dividilas en cuotas (mensuales, quincenales o semanales, con interés opcional). Cada cuota que pagues baja esas deudas solas.</div>`}
    <h2 class="section">Por persona</h2>

  root.querySelectorAll('[data-cashweek]').forEach(b => b.onclick = () => debtCashflowModal(b.dataset.cashweek));
  $('#addPlan').onclick = planModal;
  root.querySelectorAll('[data-plan-pay]').forEach(b => b.onclick = () => payPlanInstallment(b.dataset.planPay));

  $('#addDebt').onclick = () => debtModal();

function payDebt(id) {
  const d = state.debts.find(x => x.id === id); if (!d) return;
  if (debtInPlan(id)) return toast('Este ítem está en un plan de pago: pagá la cuota desde el plan');
  const rem = debtRemaining(d), owe = debtDir(d) === 'owe';
  const what = d.name ? ` (${esc(d.name)})` : '';
  const cw = state.wallets.filter(w => walletCur(w.id) === d.currency);
  if (!cw.length) return toast(`No tenés ninguna billetera en ${d.currency} para registrar el movimiento`);
  const w0 = cw[0].id, u0 = lensUnit() ? lens : state.units[0]?.id;
  const registrar = v => {
    const walletId = $('#payWallet').value, unitId = $('#payUnit').value;
    d.paid = Math.min(d.amount, (d.paid || 0) + v);
    state.movements.push({ id: uid(), type: owe ? 'expense' : 'income', amount: v, date: todayISO(), categoryId: null,
      note: `${owe ? 'Pago a' : 'Cobro de'} ${d.person}${what}`, source: 'manual', attachment: null,
      postings: [{ walletId, unitId, amount: owe ? -v : v }] });
    save(); closeModal(); render();
    toast(debtRemaining(d) <= 0.005 ? (owe ? 'Deuda saldada 🎉' : 'Cobrado por completo 🎉') : (owe ? 'Pago registrado' : 'Cobro registrado'));
  };
  openModal({ title: owe ? 'Registrar pago' : 'Registrar cobro',
    body: `<div class="hint" style="margin-top:0">${owe ? `Le debés <b>${fmtCur(rem, d.currency)}</b> a ${esc(d.person)}${what}.` : `${esc(d.person)} te debe <b>${fmtCur(rem, d.currency)}</b>${what}.`}</div>
      <div class="field"><label>${owe ? 'Monto que pagás' : 'Monto que te paga'} (${d.currency})</label><input id="payAmt" type="number" step="0.01" value="${rem}" style="font-size:20px;font-weight:700;text-align:center"></div>
      <div class="two"><div class="field"><label>${owe ? 'Sale de' : 'Entra a'}</label><select id="payWallet">${walletOptionsCur(d.currency, w0)}</select></div>
        <div class="field"><label>Unidad</label><select id="payUnit">${unitOptions(u0)}</select></div></div>
      <div class="hint">Además de descontarlo de la deuda, se registra como ${owe ? 'un gasto' : 'un ingreso'} en esa billetera.</div>
      <div class="modal-actions"><button class="btn ghost" id="payAll">${owe ? 'Saldar todo' : 'Cobrar todo'}</button><button class="btn" id="okPay">Registrar</button></div>`,
    onOpen: () => {
      $('#payAll').onclick = () => registrar(rem);
      $('#okPay').onclick = () => {
        const v = parseFloat($('#payAmt').value); if (!v || v <= 0) return toast('Ingresá un monto');
        registrar(Math.min(rem, v));
      };
    } });
}

// ---------- Vista: Movimientos ----------
let filterUnit = 'all', filterType = 'all', filterRec = 'all', searchText = '';
// Números al estilo argentino: "1.500,50" → 1500.5 (el punto es de miles).
const parseSearchNum = s => parseFloat(String(s).replace(/\./g, '').replace(',', '.')) || 0;
function renderMovements() {
  const unitOpts = ['<option value="all">Todas las unidades</option>']
    .concat(state.units.map(u => `<option value="${u.id}" ${filterUnit === u.id ? 'selected' : ''}>${esc(u.name)}</option>`)).join('');
  const typeOpts = [['all', 'Todos'], ['income', 'Ingresos'], ['expense', 'Gastos'], ['transfer', 'Transferencias']]
    .map(([v, l]) => `<option value="${v}" ${filterType === v ? 'selected' : ''}>${l}</option>`).join('');
  const recOpts = [['all', '✓ Todo'], ['pending', 'Sin conciliar'], ['done', 'Conciliados']]
    .map(([v, l]) => `<option value="${v}" ${filterRec === v ? 'selected' : ''}>${l}</option>`).join('');

  let list = lensFilter(periodMovements()).sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
  if (filterType !== 'all') list = list.filter(m => m.type === filterType);
  if (filterUnit !== 'all') list = list.filter(m => m.postings.some(p => p.unitId === filterUnit));
  if (filterRec !== 'all') list = list.filter(m => filterRec === 'done' ? m.reconciled : !m.reconciled);
  if (searchText) {
    // Cada palabra debe matchear: texto (nota/categoría/billetera/unidad, sirve para #etiquetas) o monto (>5000, <2000, 1000-3000).
    const tokens = searchText.toLowerCase().split(/\s+/).filter(Boolean);
    list = list.filter(m => {
      const hay = ((m.note || '') + ' ' + catFullName(m.categoryId) + ' ' + m.postings.map(p => (wallet(p.walletId)?.name || '') + ' ' + (unit(p.unitId)?.name || '')).join(' ')).toLowerCase();
      return tokens.every(tk => {
        let mm;
        if ((mm = tk.match(/^>([\d.,]+)$/))) return m.amount > parseSearchNum(mm[1]);
        if ((mm = tk.match(/^<([\d.,]+)$/))) return m.amount < parseSearchNum(mm[1]);
        if ((mm = tk.match(/^([\d.,]+)-([\d.,]+)$/))) return m.amount >= parseSearchNum(mm[1]) && m.amount <= parseSearchNum(mm[2]);
        return hay.includes(tk);
      });
    });
  }
  const rows = list.map(m => movementRow(m, { rec: true })).join('') || emptyBox('🔍', 'No hay movimientos con estos filtros');

  const root = $('#view-movements');
  root.innerHTML = `
    <div class="toolbar">${periodNavHTML()}</div>
    <div class="toolbar">
      <input id="search" type="text" placeholder="🔍 Buscar… (#etiqueta · >5000 · 1000-3000)" value="${esc(searchText)}" style="flex:1;min-width:140px">
      <select id="fUnit">${unitOpts}</select>
      <select id="fType">${typeOpts}</select>
      <select id="fRec" title="Conciliación con el banco">${recOpts}</select>
      <button class="btn ghost sm" id="printMovs" title="Imprimir o guardar como PDF">🖨</button>
      <button class="btn ghost sm" id="exportBtn">⬇ Copia</button>
    </div>
    <div class="card list">${rows}</div>`;
  wirePeriod(root);
  $('#fUnit').onchange = e => { filterUnit = e.target.value; renderMovements(); };
